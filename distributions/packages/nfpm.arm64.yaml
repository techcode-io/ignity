name: "ignity"
arch: "arm64"
version: "0.1.0-dev"
section: "default"
priority: "extra"
maintainer: "Adrien Mannocci <adrien.mannocci@gmail.com>"
description: |
  Ignity is a dead simple process supervision system for containers based on s6.
  It bundles static builds of execline, s6 and s6-portable-utils.
vendor: "techcode.io"
homepage: "https://github.com/techcode-io/ignity"
license: "Apache-2.0"
# The bundled binaries are the ones of execline, s6 and s6-portable-utils
provides:
  - "execline"
  - "s6"
  - "s6-portable-utils"
conflicts:
  - "execline"
  - "s6"
  - "s6-portable-utils"
replaces:
  - "execline"
  - "s6"
  - "s6-portable-utils"
overrides:
  # useradd, groupadd and getent (preboot, gen-accounts), GNU find (fix-perms) and grep (gen-accounts)
  deb:
    depends:
      - "passwd"
      - "findutils"
      - "grep"
  rpm:
    depends:
      - "shadow-utils"
      - "findutils"
      - "grep"
  apk:
    depends:
      - "shadow"
      - "findutils"
      - "grep"
contents:
  - src: ./dist/ignity/bin/*
    dst: /bin/

  # cd, umask and wait: rpm distributions ship their own (bash)
  - src: ./dist/ignity/posix/*
    dst: /bin/
    packager: deb

  - src: ./dist/ignity/posix/*
    dst: /bin/
    packager: apk

  - src: ./dist/ignity/usr/libexec
    dst: /usr/libexec
    type: tree

  - src: ./dist/ignity/init
    dst: /init

  - src: ./dist/ignity/etc/s6
    dst: /etc/s6
    type: tree

  - src: ./dist/ignity/usr/bin/*
    dst: /usr/bin/

  - src: ./dist/ignity/etc/ignity/init/00-container-discover
    dst: /etc/ignity/init/00-container-discover
    type: config|noreplace

  - dst: /etc/ignity/envs
    type: dir

  - dst: /etc/ignity/services
    type: dir

  - dst: /etc/ignity/perms
    type: dir

  - dst: /etc/ignity/finalize
    type: dir

  - dst: /run/ignity
    type: dir
